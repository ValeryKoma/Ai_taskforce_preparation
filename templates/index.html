<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HORECA Competition Lens</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 16px; cursor: pointer; }
    .flash { background: #fee; border: 1px solid #c00; padding: 10px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>HORECA Competition Lens</h1>
  <p>Check nearby mapped competitors before opening a café, restaurant or hotel.</p>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}

  <form action="{{ url_for('search') }}" method="post">
    <label for="address">Address</label>
    <input type="text" id="address" name="address"
           placeholder="e.g. Johanna Westerdijkplein 75, The Hague" required>

    <label for="category">Category</label>
    <select id="category" name="category" required>
      {% for c in categories %}
        <option value="{{ c }}">{{ c }}</option>
      {% endfor %}
    </select>

    <button type="submit">Search within 1 km</button>
  </form>
</body>
</html>
